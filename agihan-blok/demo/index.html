</script><script>
/* Logik pengiraan Agihan Blok. Tiada akses DOM di sini. */
const SIDE = ['B', 'F', 'H', 'J', 'K', 'R'];
const TINGKATAN = [1, 2, 3, 4, 5];
const SEMUA_KELAS = TINGKATAN.flatMap((t) => SIDE.map((s) => `${t}${s}`));
const MINIT_SEBLOK = 30;

const norm = (s) => String(s ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
const subjekDef = (st, kod) => st.subjek.find((s) => s.kod === kod);
const kunci = (g, s, u) => `${g}\u0001${s}\u0001${u}`;

/** "3JK" -> {label:"3JK", kelas:["3J","3K"], tingkatan:3}; tidak sah -> null */
function parseUnit(raw) {
  const m = /^([1-5])([BFHJKR]{1,6})$/i.exec(String(raw ?? '').replace(/\s+/g, ''));
  if (!m) return null;
  const huruf = m[2].toUpperCase().split('');
  if (new Set(huruf).size !== huruf.length) return null;
  const t = Number(m[1]);
  const susun = SIDE.filter((s) => huruf.includes(s));
  return { label: `${t}${susun.join('')}`, kelas: susun.map((s) => `${t}${s}`), tingkatan: t };
}

function unitsFor(st, kod) {
  const def = subjekDef(st, kod);
  if (!def) return [];
  if (def.jenis === 'set') {
    return [...(st.units[kod] ?? [])].sort((a, b) => a.tingkatan - b.tingkatan || a.label.localeCompare(b.label));
  }
  const blok = st.blok[kod] ?? [];
  return SEMUA_KELAS.filter((k) => blok[Number(k[0]) - 1] != null).map((k) => ({ label: k, kelas: [k], tingkatan: Number(k[0]) }));
}

const unitLookup = (st, kod, label) => unitsFor(st, kod).find((u) => u.label === label) ?? parseUnit(label);
const blokUnit = (st, kod, u) => (st.blok[kod] ?? [])[u.tingkatan - 1] ?? 0;
const jangkaanUnit = (st, kod, label) => st.jangkaan[kod]?.[label] ?? subjekDef(st, kod)?.jangkaanAsal ?? 1;
const subjekDimulakan = (st, kod) => st.tugasan.some((t) => t.subjek === kod);
const guruUnit = (st, kod, label) => new Set(st.tugasan.filter((t) => t.subjek === kod && t.unit === label).map((t) => t.guru));
const bilGuruUnit = (st, kod, label) => guruUnit(st, kod, label).size;

function jumlahSemua(st) {
  const m = new Map();
  for (const t of st.tugasan) {
    const u = unitLookup(st, t.subjek, t.unit);
    if (!u) continue;
    const b = blokUnit(st, t.subjek, u);
    const c = m.get(t.guru) ?? { total: 0, per: {} };
    c.total += b;
    c.per[t.subjek] = (c.per[t.subjek] ?? 0) + b;
    m.set(t.guru, c);
  }
  return m;
}

/** Subjek, guru dan blok bagi satu kelas. Blok dikira sekali bagi kelas; subjek sekumpulan alternatif dikira sekali (nilai terbesar). */
function ringkasKelas(st, kelas) {
  const t = Number(kelas[0]);
  const baris = [];
  for (const s of st.subjek) {
    // Unit berjangkaan 0 tanpa guru = kelas tidak mengambil subjek ini, jadi tidak disenaraikan
    const us = unitsFor(st, s.kod).filter((u) => u.kelas.includes(kelas) &&
      !(jangkaanUnit(st, s.kod, u.label) === 0 && bilGuruUnit(st, s.kod, u.label) === 0));
    if (us.length === 0) continue;
    const label = new Set(us.map((u) => u.label));
    const guru = Array.from(new Set(st.tugasan.filter((x) => x.subjek === s.kod && label.has(x.unit)).map((x) => x.guru))).sort();
    const tiada = guru.length === 0;
    if (tiada && !subjekDimulakan(st, s.kod)) continue;
    baris.push({ kod: s.kod, nama: s.nama, guru, blok: st.blok[s.kod]?.[t - 1] ?? 0, tiada, kumpulan: s.kumpulan || '' });
  }
  const pilihan = Array.from(new Set(baris.flatMap((b) => b.guru))).sort();
  const ikutKumpulan = new Map();
  for (const b of baris) {
    if (b.tiada) continue;
    const k = b.kumpulan || `#${b.kod}`;
    ikutKumpulan.set(k, Math.max(ikutKumpulan.get(k) ?? 0, b.blok));
  }
  const jumlahBlok = [...ikutKumpulan.values()].reduce((a, b) => a + b, 0);
  return { baris, pilihan, jumlahBlok };
}

function semak(st) {
  const isu = [];
  const tambah = (tahap, kategori, teks, subjek) => isu.push({ tahap, kategori, teks, subjek });
  const namaGuru = new Set(st.guru.map((g) => g.nama));

  for (const s of st.subjek) {
    const units = unitsFor(st, s.kod);
    if (!subjekDimulakan(st, s.kod)) {
      if (units.length) tambah('info', 'Subjek belum dimulakan', `${s.kod}: belum ada agihan`, s.kod);
      else tambah('info', 'Blok belum ditetapkan', `${s.kod}: tiada blok pada mana-mana tingkatan (Tetapan)`, s.kod);
      continue;
    }
    const tiada = [], kurang = [], lebih = [];
    for (const u of units) {
      const bil = bilGuruUnit(st, s.kod, u.label);
      const jangka = jangkaanUnit(st, s.kod, u.label);
      if (jangka === 0 && bil === 0) continue; // jangkaan 0 = kelas ini tidak mengambil subjek ini (cth. elektif)
      if (bil === 0) tiada.push(u.label);
      else if (bil < jangka) kurang.push(`${u.label} (${bil}/${jangka})`);
      else if (bil > jangka) lebih.push(`${u.label} (${bil}/${jangka})`);
    }
    if (s.jenis === 'set') {
      if (tiada.length) tambah('ralat', 'Unit tiada guru', `${s.kod}: ${tiada.join(', ')}`, s.kod);
      const tak = [...kurang, ...lebih];
      if (tak.length) tambah('amaran', 'Set: bilangan guru tidak sepadan jangkaan', `${s.kod}: ${tak.join(', ')}`, s.kod);
      if (s.liputanPenuh) {
        const diliputi = new Set(units.flatMap((u) => u.kelas));
        const luar = SEMUA_KELAS.filter((k) => st.blok[s.kod]?.[Number(k[0]) - 1] != null && !diliputi.has(k));
        if (luar.length) tambah('ralat', 'Kelas tiada dalam mana-mana unit set', `${s.kod}: ${luar.join(', ')}`, s.kod);
      }
    } else {
      if (tiada.length) tambah('ralat', 'Kelas belum ada guru', `${s.kod}: ${tiada.join(', ')}`, s.kod);
      if (kurang.length) tambah('amaran', 'Bilangan guru kurang daripada jangkaan', `${s.kod}: ${kurang.join(', ')}`, s.kod);
      if (lebih.length && !s.bolehLebih) tambah('amaran', 'Kelas diagih dua kali', `${s.kod}: ${lebih.join(', ')}`, s.kod);
    }
    const guna = new Set(st.tugasan.filter((t) => t.subjek === s.kod).map((t) => unitLookup(st, s.kod, t.unit)?.tingkatan));
    for (const t of guna) {
      if (t && st.blok[s.kod]?.[t - 1] == null) tambah('ralat', 'Blok belum ditetapkan', `${s.kod} Tingkatan ${t}`, s.kod);
    }
  }

  const tanpaSubjek = [...new Set(st.tugasan.filter((t) => !subjekDef(st, t.subjek)).map((t) => t.subjek))];
  if (tanpaSubjek.length) tambah('ralat', 'Subjek dalam AGIHAN tiada dalam SUBJEK', tanpaSubjek.join(', '));
  const tanpaGuru = [...new Set(st.tugasan.filter((t) => !namaGuru.has(t.guru)).map((t) => t.guru))];
  for (const g of tanpaGuru) tambah('ralat', 'Nama guru tiada dalam senarai GURU', g);

  const jum = jumlahSemua(st);
  for (const g of st.guru) {
    const j = jum.get(g.nama)?.total ?? 0;
    if (j === 0) tambah('info', 'Guru belum diagih', g.nama);
  }

  for (const k of SEMUA_KELAS) {
    const g = st.guruKelas[k];
    if (!g) continue;
    if (!ringkasKelas(st, k).pilihan.includes(g)) tambah('ralat', 'Guru kelas tidak mengajar kelas itu', `${k}: ${g}`);
  }
  return isu;
}

function analisisGuru(st) {
  const jum = jumlahSemua(st);
  return st.guru.map((g, i) => {
    const mine = st.tugasan.filter((t) => t.guru === g.nama);
    const kelas = new Set();
    const tk = new Set();
    for (const t of mine) {
      const u = unitLookup(st, t.subjek, t.unit);
      if (!u) continue;
      u.kelas.forEach((k) => kelas.add(k));
      tk.add(u.tingkatan);
    }
    const total = jum.get(g.nama)?.total ?? 0;
    return {
      i, nama: g.nama, total, status: total > 0 ? 'ada' : 'belum', bilKelas: kelas.size,
      tingkatan: [...tk].sort(), per: jum.get(g.nama)?.per ?? {},
    };
  });
}

/** Contoh pengesahan daripada spesifikasi (bahagian 7). Menggantikan semua agihan. */
function muatContoh(st) {
  const cari = (frag) => st.guru.find((x) => norm(x.nama).includes(frag))?.nama;
  const T = [];
  const add = (frag, subjek, units) => {
    const g = cari(frag);
    if (g && subjekDef(st, subjek)) units.forEach((unit) => T.push({ guru: g, subjek, unit }));
  };
  add('FARAH IDAYU', 'BM', ['1B', '2B', '2F', '4J']);
  add('NURUL HUSNA BINTI AZMI', 'BAN', ['2JKR', '3JKR', '4BFH']);
  add('NOR SALWANA', 'PM', ['1JR', '3BJ', '4JR', '5JR']);
  add('MOHAMAD ZAKI', 'BAN', ['1BFH', '2BFH']);
  const rows = {};
  for (const t of T) {
    rows[t.subjek] = rows[t.subjek] ?? [];
    if (!rows[t.subjek].includes(t.guru)) rows[t.subjek].push(t.guru);
  }
  st.tugasan = T;
  st.rows = rows;
  st.guruKelas = {};
}

const MOD = {
  buka: { nama: 'Terbuka', ikon: 'bukaKunci', teks: 'Semua pengguna boleh melihat dan menyunting agihan.' },
  baca: { nama: 'Baca sahaja', ikon: 'mata', teks: 'Pengguna boleh melihat, tetapi tidak boleh menyunting atau menyimpan.' },
  tutup: { nama: 'Ditutup', ikon: 'kunci', teks: 'Hanya pentadbir boleh membuka sistem. Pengguna lain melihat notis ditutup.' },
};
// Tindakan yang dibenarkan dalam mod baca sahaja.
const BACA_OK = new Set(['tab', 'tk', 'kembang', 'tapis', 'pergiSubjek', 'csv', 'excel', 'bukaSheet', 'tutupBanner', 'muatSemula', 'muatSemulaTerus']);
const bolehSunting = () => !!meta.admin || meta.mod === 'buka';
// Tindakan yang mengubah tetapan: pentadbir sahaja.
const ADMIN_SAHAJA = new Set([
  'buangUnit', 'buangSubjek', 'tambahSubjek', 'tambahGuru', 'buangGuru', 'kosongkan',
  'tambahUnitGrid', 'tambahUnitTetapan', 'setMod', 'simpanPentadbir',
  'blok', 'jangkaanAsal', 'bendera', 'kumpulan', 'jenis', 'jangkaan',
]);
const halangTetapan = (nama) => {
  if (meta.admin || !ADMIN_SAHAJA.has(nama)) return false;
  tunjukBanner('amaran', 'Hanya pentadbir boleh mengubah tetapan.', 2500);
  return true;
};
const ikon = (n, k = 'ikon') => `<svg class="${k}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[n]}</svg>`;
const adaTugasan = (g, s, u) => IDX.has(kunci(g, s, u));
const draf = (k, lalai = '') => ui.draf[k] ?? lalai;
// Mesej ralat pelayan tanpa awalan "Error:" / "Exception:" yang ditambah oleh Google
const mesejRalat = (e) => String(e && e.message ? e.message : e).replace(/^(Error|Exception|ScriptError):s*/i, '');

/* ---------- Muat & simpan ---------- */

function muat() {
  $('#memuat').hidden = false;
  google.script.run.withSuccessHandler(terima).withFailureHandler(gagal).muatData();
}

function terima(json) {
  const r = JSON.parse(json);
  $('#memuat').hidden = true;
  $('#nama-sekolah').textContent = r.namaSekolah || '';
  if (r.perluLesen) { paparLesen(r); return; }
  if (r.ditutup) { paparDitutup(r); return; }
  st = r.state;
  versi = r.versi;
  meta = r;
  kotor = false;
  bilUbah = 0;
  clearTimeout(tidakAktifTimer);
  ui.banner = null;
  if (!subjekDef(st, ui.subjek)) ui.subjek = subjekDef(st, 'BM') ? 'BM' : (st.subjek[0]?.kod ?? '');
  if (r.contoh) ui.banner = { jenis: 'amaran', teks: 'Sistem ini mengandungi data contoh sekolah rekaan. ' + (r.admin ? 'Buang melalui menu Agihan Blok > Buang data contoh dalam Google Sheet sebelum memasukkan data sebenar.' : '') };
  $('#memuat').hidden = true;
  render();
}

function gagal(e) {
  sibuk = false;
  $('#memuat').hidden = true;
  tunjukBanner('ralat', `Ralat: ${mesejRalat(e)}`);
  if (st) render(); else renderShell();
}

function simpan(paksa, auto) {
  if (sibuk || !st) return;
  sibuk = true;
  clearTimeout(tidakAktifTimer);
  const dihantar = bilUbah; // perubahan yang dibuat semasa menyimpan kekal "belum disimpan"
  renderShell();
  google.script.run
    .withSuccessHandler((json) => {
      const r = JSON.parse(json);
      sibuk = false;
      if (r.ditolak && r.mesej) {
        tunjukBanner('ralat', r.mesej);
      } else if (r.ditolak) {
        meta.mod = r.mod;
        tunjukBanner('amaran', r.mod === 'tutup' ? 'Sistem telah ditutup oleh pentadbir. Perubahan tidak disimpan.' : 'Sistem dalam mod baca sahaja. Perubahan tidak disimpan.');
      } else if (r.konflik) {
        ui.banner = { jenis: 'amaran', konflik: true, teks: `Sheet telah disimpan oleh ${r.terakhir || 'pengguna lain'} selepas anda membuka app. Pilih tindakan:` };
      } else {
        versi = r.versi;
        meta.terakhir = r.terakhir;
        bilUbah = Math.max(0, bilUbah - dihantar);
        kotor = bilUbah > 0;
        if (kotor) tetapkanTidakAktif();
        tunjukBanner('ok', auto ? 'Disimpan automatik.' : 'Disimpan ke Google Sheets.', 2000);
      }
      render();
    })
    .withFailureHandler(gagal)
    .simpanData(JSON.stringify(st), paksa ? -1 : versi);
}

/** Tukar mod akses / senarai pentadbir (terus ke pelayan, bukan melalui Simpan). */
function tukarAkses(mod, pentadbir) {
  if (ui.aksesSibuk) return;
  ui.aksesSibuk = true;
  render();
  google.script.run
    .withSuccessHandler((json) => {
      const r = JSON.parse(json);
      ui.aksesSibuk = false;
      meta.mod = r.mod;
      meta.pentadbir = r.pentadbir;
      delete ui.draf.pentadbir;
      tunjukBanner('ok', `Akses sistem: ${MOD[r.mod].nama}.`, 2500);
      render();
    })
    .withFailureHandler((e) => { ui.aksesSibuk = false; gagal(e); })
    .tetapkanAkses(mod, pentadbir);
}

/** Simpan automatik (tukar tab, tidak aktif). Berhenti jika ada konflik yang menunggu keputusan pengguna. */
function autoSimpan() {
  if (!st || !kotor || sibuk || !bolehSunting() || (ui.banner && ui.banner.konflik)) return;
  simpan(false, true);
}

function tetapkanTidakAktif() {
  clearTimeout(tidakAktifTimer);
  if (kotor) tidakAktifTimer = setTimeout(autoSimpan, SAAT_TIDAK_AKTIF * 1000);
}

function tunjukBanner(jenis, teks, auto) {
  ui.banner = { jenis, teks };
  clearTimeout(bannerTimer);
  if (auto) bannerTimer = setTimeout(() => { ui.banner = null; renderShell(); }, auto);
  renderShell();
}

function ubah(fn) {
  if (!bolehSunting()) { tunjukBanner('amaran', 'Sistem dalam mod baca sahaja.', 2500); return; }
  fn(st);
  kotor = true;
  bilUbah++;
  tetapkanTidakAktif();
  render();
}

function bukaUrl(url, perluSimpan) {
  if (perluSimpan && kotor) {
    tunjukBanner('amaran', 'Eksport mengambil data yang telah disimpan. Klik Simpan sekarang pada jalur kuning dahulu, kemudian cuba lagi.');
    return;
  }
  window.open(url, '_blank');
}

/* ---------- Render ---------- */

function render() {
  if (!st) return;
  IDX = new Set(st.tugasan.map((t) => kunci(t.guru, t.subjek, t.unit)));
  JUM = jumlahSemua(st);
  ISU = semak(st);
  const fokus = simpanFokus();
  renderShell();
  if (ui.tab === 'tetapan' && !meta.admin) ui.tab = 'agihan'; // tab Tetapan untuk pentadbir sahaja
  const p = { agihan: paparAgihan, kelas: paparKelas, guru: paparGuru, semakan: paparSemakan, tetapan: paparTetapan }[ui.tab];
  $('#utama').innerHTML = p();
  if (!bolehSunting()) kunciKawalan();
  else if (!meta.admin) kunciTetapan();
  pulihFokus(fokus);
}

/** Mod baca sahaja: lumpuhkan semua kawalan suntingan, kekalkan navigasi dan tapisan. */
function kunciKawalan() {
  document.querySelectorAll('#utama input, #utama select, #utama button').forEach((el) => {
    if (el.dataset.act && BACA_OK.has(el.dataset.act)) return;
    if (['subjek', 'susun'].includes(el.dataset.change) || el.dataset.input === 'cari') return;
    el.disabled = true;
  });
}

/** Bukan pentadbir: kunci semua kawalan tetapan (tab Tetapan sepenuhnya, jangkaan & unit dalam grid). */
function kunciTetapan() {
  document.querySelectorAll('#utama input, #utama select, #utama button, #utama textarea').forEach((el) => {
    const nama = el.dataset.act || el.dataset.change || el.dataset.enter;
    if (ui.tab === 'tetapan' || (nama && ADMIN_SAHAJA.has(nama))) el.disabled = true;
  });
}

/** Salinan belum berlesen: pentadbir masukkan kod sekolah, pengguna lain melihat notis. */
function paparLesen(r) {
  st = null;
  meta = r;
  $('#tab').innerHTML = '';
  $('#aksi').innerHTML = '';
  $('#banner').innerHTML = '';
  const borang = r.admin ? `
      <div class="borang-lesen">
        <label for="kod-lesen" class="label">Kod sekolah</label>
        <input id="kod-lesen" class="inp mono" maxlength="12" placeholder="Contoh: BEA1234" autocomplete="off" value="${esc(r.kod || '')}" data-enter="aktifkanLesen">
        <button class="btn utama" data-act="aktifkanLesen" ${ui.lesenSibuk ? 'disabled' : ''}>${ikon('kunci')}<span>${ui.lesenSibuk ? 'Menyemak…' : 'Aktifkan sistem'}</span></button>
      </div>
      ${ui.mesejLesen ? `<p class="mesej">${esc(ui.mesejLesen)}</p>` : ''}`
    : `<p class="redup">Sila minta pentadbir sistem sekolah anda mengaktifkannya.</p>
      <button class="btn" data-act="muatSemula">${ikon('segar')}<span>Cuba semula</span></button>`;
  $('#utama').innerHTML = `
    <div class="ditutup">
      <span class="cip-ikon besar g-indigo">${ikon('perisai')}</span>
      <h2>Aktifkan Agihan Blok Mengajar</h2>
      <p class="redup">${esc(r.perluAktif || !r.mesej
        ? (r.admin ? 'Sistem ini percuma untuk sekolah penyumbang Sistem Agihan Tugas Guru. Masukkan kod sekolah yang berdaftar untuk mengaktifkannya.' : 'Sistem ini belum diaktifkan untuk sekolah anda.')
        : r.mesej)}</p>
      ${borang}
      <p class="redup kecil-teks">Satu kod sekolah hanya boleh digunakan oleh satu salinan sistem. Maklumat lanjut: <b>${esc(r.laman || '')}</b></p>
      ${r.pengguna ? `<p class="redup kecil-teks">Log masuk sebagai ${esc(r.pengguna)}</p>` : ''}
    </div>`;
  const i = document.getElementById('kod-lesen');
  if (i) i.focus();
}

function paparDitutup(r) {
  st = null;
  meta = r;
  $('#tab').innerHTML = '';
  $('#aksi').innerHTML = '';
  $('#banner').innerHTML = '';
  $('#utama').innerHTML = `
    <div class="ditutup">
      <span class="cip-ikon besar g-slate">${ikon('kunci')}</span>
      <h2>Sistem ditutup buat sementara</h2>
      <p class="redup">Pentadbir telah menutup akses kepada Agihan Blok Mengajar. Sila hubungi pentadbir atau cuba lagi kemudian.</p>
      ${r.pengguna ? `<p class="redup kecil-teks">Log masuk sebagai ${esc(r.pengguna)}</p>` : ''}
      <button class="btn" data-act="muatSemula">${ikon('segar')}<span>Cuba semula</span></button>
    </div>`;
}

function simpanFokus() {
  const a = document.activeElement;
  if (!a || !a.id) return null;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch (_) { /* jenis input tanpa pilihan */ }
  return { id: a.id, s, e };
}

function pulihFokus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (_) { /* abaikan */ }
}

/** Butang dua langkah: klik pertama minta pengesahan, klik kedua laksana. */
function btnDua(k, label, sahLabel, kelas, attrs, terus) {
  if (terus) return `<button class="${kelas}" ${attrs}>${label}</button>`;
  const aktif = ui.sahkan === k;
  return `<button class="${kelas}${aktif ? ' sah' : ''}" data-sah="${esc(k)}" ${attrs}>${aktif ? sahLabel : label}</button>`;
}

function renderShell() {
  const bilRalat = ISU.filter((i) => i.tahap === 'ralat').length;
  $('#tab').innerHTML = TABS.filter((t) => t.id !== 'tetapan' || meta.admin).map((t) => `
    <button class="tab-btn${ui.tab === t.id ? ' aktif' : ''}" data-act="tab" data-id="${t.id}"${ui.tab === t.id ? ' aria-current="page"' : ''}>
      ${ikon(t.id)}<span>${t.nama}</span>${t.id === 'semakan' && bilRalat ? `<span class="lencana" aria-label="${bilRalat} ralat">${bilRalat}</span>` : ''}
    </button>`).join('');

  const status = sibuk ? 'Menyimpan…' : kotor ? 'Belum disimpan' : meta.terakhir ? `Disimpan ${meta.terakhir}` : 'Tiada perubahan';
  $('#aksi').innerHTML = !st ? '' : `
    ${meta.mod && meta.mod !== 'buka' ? `<span class="pil-mod ${meta.mod}" title="${esc(MOD[meta.mod].teks)}">${ikon(MOD[meta.mod].ikon)}${MOD[meta.mod].nama}${meta.admin ? ' · anda pentadbir' : ''}</span>` : ''}
    ${bolehSunting() ? `<span class="status${kotor ? ' kotor' : ''}${sibuk ? ' sibuk' : ''}" role="status"><span class="titik-status"></span>${esc(status)}</span>` : ''}
    ${btnDua('muatSemula', `${ikon('segar')}<span>Muat semula</span>`, 'Buang perubahan?', 'btn hantu-gelap', 'data-act="muatSemula" title="Baca semula data daripada Sheet"', !kotor)}
    ${meta.contoh && !meta.admin ? '' : `<button class="btn hantu-gelap" data-act="bukaSheet" title="Buka Google Sheet">${ikon('sheet')}<span class="sembunyi-kecil">Sheet</span></button>
    <button class="btn hantu-gelap" data-act="excel" title="Muat turun semua helaian sebagai .xlsx">${ikon('turun')}<span class="sembunyi-kecil">Excel</span></button>`}
`;

  const jalur = $('#jalur');
  const tunjuk = !!st && bolehSunting() && (kotor || sibuk);
  jalur.hidden = !tunjuk;
  jalur.innerHTML = !tunjuk ? '' : sibuk
    ? `<span class="titik-jalur sibuk"></span><b>Menyimpan…</b>`
    : `<span class="titik-jalur"></span><span><b>${bilUbah} perubahan belum disimpan.</b><span class="sembunyi-kecil"> Disimpan automatik apabila anda bertukar tab atau tidak aktif ${SAAT_TIDAK_AKTIF} saat.</span></span>
      <button class="btn-jalur" data-act="simpan" title="Ctrl+S">${ikon('simpan')}<span>Simpan sekarang</span></button>`;

  const b = ui.banner;
  $('#banner').innerHTML = !b ? '' : `
    <div class="banner ${b.jenis}" role="${b.jenis === 'ralat' ? 'alert' : 'status'}">
      <span>${esc(b.teks)}</span>
      ${b.konflik ? `
        <button class="btn" data-act="muatSemulaTerus">Muat semula (buang perubahan saya)</button>
        ${btnDua('paksa', 'Tulis ganti dengan data saya', 'Pasti? Kerja orang lain akan hilang', 'btn', 'data-act="paksaSimpan"')}` : ''}
      <button class="tutup" data-act="tutupBanner" aria-label="Tutup">${ikon('tutup')}</button>
    </div>`;
}

/* ---------- Tab: Agihan Panitia ---------- */

function paparAgihan() {
  const kod = ui.subjek;
  const def = subjekDef(st, kod);
  if (!def) return '<div class="kosong-kotak">Tiada subjek. Tambah subjek di tab Tetapan.</div>';
  const units = unitsFor(st, kod);
  const dimulakan = subjekDimulakan(st, kod);
  const bertugas = st.tugasan.filter((t) => t.subjek === kod).map((t) => t.guru);
  const baris = Array.from(new Set([...(st.rows[kod] ?? []), ...bertugas]));
  ui.baris = baris;
  const kumpulan = TINGKATAN.map((t) => ({ t, n: units.filter((u) => u.tingkatan === t).length })).filter((g) => g.n > 0);
  const sp = (i) => (i === 0 || units[i - 1].tingkatan !== units[i].tingkatan ? ' sempadan' : '');
  const blokInfo = (st.blok[kod] ?? []).map((b, i) => `<span class="pil${b == null ? ' kosong' : ''}"><span>T${i + 1}</span><b>${b ?? '–'}</b></span>`).join('');

  let h = `
    <div class="panel bar-alat">
      <label>
        <span class="label">Subjek</span>
        <select id="pilih-subjek" class="inp lebar" data-change="subjek">
          ${st.subjek.map((s) => `<option value="${esc(s.kod)}"${s.kod === kod ? ' selected' : ''}>${esc(s.kod)} · ${esc(s.nama)}${s.jenis === 'set' ? ' (set)' : ''}</option>`).join('')}
        </select>
      </label>
      <div class="info-subjek">
        <div class="pil-baris"><span class="jenis-lencana ${def.jenis}">${def.jenis === 'set' ? 'Subjek set' : 'Subjek kelas'}</span>${blokInfo}<span class="redup kecil-teks">blok seminggu</span></div>
      </div>
    </div>`;

  if (!units.length) {
    // Tanpa unit, grid tidak boleh dipaparkan; guru tidak boleh ditambah sehingga blok/unit diisi.
    const tiadaBlok = (st.blok[kod] ?? []).every((b) => b == null);
    h += `<div class="kosong-kotak kosong-tindakan">
      <span class="cip-ikon g-amber">${ikon('amaran')}</span>
      <div>
        <b>${tiadaBlok ? `Blok ${esc(kod)} belum ditetapkan` : `Belum ada unit bagi ${esc(kod)}`}</b>
        <p class="redup">${tiadaBlok
          ? 'Grid dan senarai guru hanya muncul selepas blok seminggu diisi bagi sekurang-kurangnya satu tingkatan.'
          : 'Subjek set memerlukan unit (cth. 1BFH) sebelum guru boleh diagih.'}
          ${meta.admin ? '' : ' Sila minta pentadbir mengisinya.'}</p>
        ${tiadaBlok && meta.admin ? `<div class="blok-segera">
          ${TINGKATAN.map((t, i) => `<label><span class="label">T${t}</span><input id="bs-${esc(kod)}-${i}" class="inp-blok" type="number" min="0" max="20" placeholder="–" data-change="blok" data-k="${esc(kod)}" data-i="${i}" aria-label="Blok ${esc(kod)} Tingkatan ${t}"></label>`).join('')}
          <span class="redup kecil-teks">Kosongkan tingkatan yang tiada subjek ini.</span>
        </div>` : ''}
      </div>
    </div>`;
  } else {
    h += `<div class="kotak grid-bungkus"><table class="grid-agihan">
      <thead>
        <tr>
          <th rowspan="2" class="lekat-guru">Guru</th>
          <th rowspan="2" class="lekat-jum">Jum</th>
          ${kumpulan.map((g) => `<th colspan="${g.n}" class="sempadan">Tingkatan ${g.t}</th>`).join('')}
        </tr>
        <tr>${units.map((u, i) => `<th class="unit mono${sp(i)}" title="${esc(u.kelas.join(', '))}">${esc(u.label)}</th>`).join('')}</tr>
      </thead>
      <tbody>`;
    if (!baris.length) h += `<tr><td colspan="${units.length + 2}" class="pad redup">Tiada guru lagi. Tambah guru di bawah.</td></tr>`;
    baris.forEach((g, gi) => {
      let jum = 0;
      const sel = units.map((u, i) => {
        const on = adaTugasan(g, kod, u.label);
        const b = blokUnit(st, kod, u);
        if (on) jum += b;
        return `<td class="p0${sp(i)}"><button id="s-${gi}-${esc(u.label)}" class="sel${on ? ' on' : ''}" data-act="togol" data-g="${gi}" data-u="${esc(u.label)}" aria-pressed="${on}" aria-label="${esc(g)}, ${esc(u.label)}">${on ? (b || '?') : '·'}</button></td>`;
      }).join('');
      const rec = st.guru.find((x) => x.nama === g);
      const total = JUM.get(g)?.total ?? 0;
      h += `<tr>
        <td class="lekat-guru" title="${esc(g)}"><div class="sel-guru"><div class="min-w-0 flex-1"><span class="nama-guru">${esc(g)}</span>
          <span class="beban mono${rec ? '' : ' lebih'}">${rec ? `${total} blok semua subjek` : 'tiada dalam senarai guru'}</span></div>
          ${btnDua(`baris:${kod}:${g}`, ikon('tutup'), 'Buang?', 'ikon-buang buang-baris', `data-act="buangBaris" data-g="${gi}" title="Buang guru daripada subjek ini" aria-label="Buang ${esc(g)} daripada ${esc(kod)}"`)}</div></td>
        <td class="lekat-jum mono">${jum || '–'}</td>
        ${sel}
      </tr>`;
    });
    h += `</tbody><tfoot>
      <tr>
        <td class="lekat-guru tajuk-kaki">Bil. guru</td><td class="lekat-jum"></td>
        ${units.map((u, i) => {
          const bil = bilGuruUnit(st, kod, u.label);
          const jangka = jangkaanUnit(st, kod, u.label);
          const k = !dimulakan ? '' : bil === jangka ? ' ok' : bil === 0 ? ' kosong' : ' tak';
          return `<td class="bil${k}${sp(i)}">${bil}</td>`;
        }).join('')}
      </tr>
      <tr>
        <td class="lekat-guru tajuk-kaki">Jangkaan guru</td><td class="lekat-jum"></td>
        ${units.map((u, i) => `<td class="p0${sp(i)}"><input id="j-${esc(u.label)}" class="inp-sel" type="number" min="0" max="9" value="${jangkaanUnit(st, kod, u.label)}" data-change="jangkaan" data-u="${esc(u.label)}" aria-label="Jangkaan guru ${esc(u.label)}"></td>`).join('')}
      </tr>
    </tfoot></table></div>`;
  }

  h += `
    <div class="baris-aksi">
      ${units.length ? `<input id="guru-baru" list="senarai-guru" class="inp lebar" placeholder="Tambah guru ke subjek ini" value="${esc(draf('guru'))}"
        data-input="draf" data-d="guru" data-enter="tambahGuruGrid" aria-label="Nama guru">
      <datalist id="senarai-guru">${st.guru.map((g) => `<option value="${esc(g.nama)}">`).join('')}</datalist>
      <button class="btn utama" data-act="tambahGuruGrid">${ikon('tambah')}<span>Tambah guru</span></button>` : ''}
      ${def.jenis === 'set' && meta.admin ? `
        <input id="unit-baru" class="inp sederhana" placeholder="Unit baru, cth. 3JK" value="${esc(draf('unit'))}"
          data-input="draf" data-d="unit" data-enter="tambahUnitGrid" aria-label="Label unit baru">
        <button class="btn" data-act="tambahUnitGrid">${ikon('tambah')}<span>Tambah unit</span></button>` : ''}
    </div>
    ${ui.mesej ? `<p class="mesej" role="status">${esc(ui.mesej)}</p>` : ''}`;
  return h;
}

/* ---------- Tab: Ringkasan Kelas ---------- */

function paparKelas() {
  const kelas = SEMUA_KELAS.filter((k) => ui.tk === 0 || Number(k[0]) === ui.tk);
  const dilantik = SEMUA_KELAS.filter((k) => st.guruKelas[k]).length;
  const adaKumpulan = st.subjek.some((s) => s.kumpulan);
  let h = `
    <div class="bar-alat" style="align-items:center">
      ${[0, ...TINGKATAN].map((t) => `<button class="btn${ui.tk === t ? ' aktif' : ''}" data-act="tk" data-t="${t}" aria-pressed="${ui.tk === t}">${t === 0 ? 'Semua' : `Tingkatan ${t}`}</button>`).join('')}
      <span class="ml-auto">Guru kelas dilantik: <span class="mono" style="font-weight:500">${dilantik}</span> / ${SEMUA_KELAS.length}</span>
    </div>
    <p class="nota">Pilihan guru kelas hanya menyenaraikan guru yang mengajar kelas itu. Blok setiap subjek dikira sekali bagi kelas walaupun diajar oleh beberapa guru.${adaKumpulan ? ' Subjek dalam kumpulan alternatif yang sama (cth. PI/PM) dikira sekali.' : ''}</p>
    <div class="grid-kad">`;
  for (const k of kelas) {
    const { baris, pilihan, jumlahBlok } = ringkasKelas(st, k);
    const dipilih = st.guruKelas[k] ?? '';
    const tidakSah = dipilih && !pilihan.includes(dipilih);
    h += `<section class="kotak kad-kelas">
      <header><h3 class="mono">${k}</h3><span><span class="mono" style="font-weight:500">${jumlahBlok}</span> blok</span></header>
      <div class="isi">
        <label>
          <span class="label">Guru kelas</span>
          <select id="gk-${k}" class="inp${tidakSah ? ' ralat' : ''}" style="width:100%" data-change="guruKelas" data-k="${k}">
            <option value="">Belum dilantik</option>
            ${tidakSah ? `<option value="${esc(dipilih)}" selected>${esc(dipilih)} (tidak mengajar kelas ini)</option>` : ''}
            ${pilihan.map((n) => `<option value="${esc(n)}"${n === dipilih ? ' selected' : ''}>${esc(n)}</option>`).join('')}
          </select>
        </label>
        <ul class="senarai-subjek">
          ${!baris.length ? '<li class="redup" style="padding:12px 0">Belum ada agihan untuk kelas ini.</li>' : ''}
          ${baris.map((b) => {
            const kk = `${k}-${b.kod}`;
            const banyak = b.guru.length > 1;
            const terbuka = !!ui.buka[kk];
            return `<li>
              <button id="kb-${kk}" class="baris-subjek" ${banyak ? `data-act="kembang" data-k="${kk}" aria-expanded="${terbuka}"` : 'tabindex="-1"'}>
                <span class="kod">${esc(b.kod)}</span>
                <span class="guru-teks${b.tiada ? ' tiada' : ''}">${b.tiada ? 'Belum ada guru' : banyak ? `${b.guru.length} guru ${terbuka ? '▾' : '▸'}` : esc(b.guru[0])}</span>
                <span class="mono kecil-teks">${b.blok}${b.kumpulan ? `<span class="lencana-kumpulan" title="Kumpulan alternatif">${esc(b.kumpulan)}</span>` : ''}</span>
              </button>
              ${banyak && terbuka ? `<ul class="sub-guru">${b.guru.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}
            </li>`;
          }).join('')}
        </ul>
      </div>
    </section>`;
  }
  return h + '</div>';
}

/* ---------- Tab: Analisis Guru ---------- */

function paparGuru() {
  const semua = analisisGuru(st);
  const kira = (s) => semua.filter((g) => g.status === s).length;
  const ber = semua.filter((g) => g.total > 0);
  const jumlah = ber.reduce((a, g) => a + g.total, 0);
  const skala = Math.max(1, ...semua.map((g) => g.total));
  const q = norm(ui.cari);
  const senarai = semua
    .filter((g) => ui.tapis === 'semua' || g.status === ui.tapis)
    .filter((g) => !q || norm(g.nama).includes(q))
    .sort((a, b) => (ui.susun === 'nama' ? a.nama.localeCompare(b.nama) : b.total - a.total || a.nama.localeCompare(b.nama)));

  const tapis = [
    ['semua', 'Bilangan guru', semua.length, 'guru', 'g-indigo'],
    ['ada', 'Ada agihan', kira('ada'), 'betul', 'g-emerald'],
    ['belum', 'Belum diagih', kira('belum'), 'jam', 'g-slate'],
  ];
  const statik = [
    ['Jumlah blok', `${jumlah}<span class="redup kecil-teks"> · ${(jumlah * MINIT_SEBLOK) / 60} jam</span>`, 'agihan', 'g-violet'],
    ['Purata seorang', ber.length ? (jumlah / ber.length).toFixed(1) : '–', 'naik', 'g-amber'],
  ];

  return `
    <div class="ringkas">
      ${tapis.map(([id, label, n, ik, warna]) => `
        <button class="kad-angka${ui.tapis === id ? ' aktif' : ''}" data-act="tapis" data-s="${id}" aria-pressed="${ui.tapis === id}">
          <span class="cip-ikon ${warna}">${ikon(ik)}</span>
          <span><span class="label">${label}</span><span class="angka">${n}</span></span>
        </button>`).join('')}
      ${statik.map(([label, n, ik, warna]) => `
        <div class="kad-angka statik">
          <span class="cip-ikon ${warna}">${ikon(ik)}</span>
          <span><span class="label">${label}</span><span class="angka">${n}</span></span>
        </div>`).join('')}
    </div>
    <p class="nota">Purata dikira daripada guru yang ada agihan. Klik kad untuk menapis.</p>

    <div class="baris-aksi">
      <span class="cari-bungkus">${ikon('cari')}<input id="cari" class="inp lebar cari" type="search" placeholder="Cari nama guru" value="${esc(ui.cari)}" data-input="cari" aria-label="Cari nama guru"></span>
      <select id="susun" class="inp" data-change="susun" aria-label="Susunan">
        <option value="blok"${ui.susun !== 'nama' ? ' selected' : ''}>Susun: blok tertinggi</option>
        <option value="nama"${ui.susun === 'nama' ? ' selected' : ''}>Susun: nama</option>
      </select>
      <button class="btn ml-auto" data-act="csv" title="Eksport helaian RINGKASAN_GURU (data tersimpan)">${ikon('turun')}<span>CSV ringkasan</span></button>
    </div>

    <div class="kotak jadual-bungkus">
      <table class="jadual">
        <thead><tr>
          <th>Guru</th><th>Blok</th><th class="kanan">Jumlah</th><th class="kanan">Minit</th><th class="kanan">Jam</th>
          <th class="kanan">Kelas</th><th>Tingkatan</th><th>Butiran</th>
        </tr></thead>
        <tbody>
          ${!senarai.length ? '<tr><td colspan="8" class="pad redup">Tiada guru sepadan dengan tapisan.</td></tr>' : ''}
          ${senarai.map((g) => `<tr>
            <td style="max-width:18rem" title="${esc(g.nama)}"><span class="nama-guru">${esc(g.nama)}</span></td>
            <td><div class="palang" aria-hidden="true"><div class="bar-ada" style="width:${(g.total / skala) * 100}%"></div></div></td>
            <td class="kanan mono" style="font-weight:600">${g.total || '–'}</td>
            <td class="kanan mono redup">${g.total * MINIT_SEBLOK || '–'}</td>
            <td class="kanan mono redup">${(g.total * MINIT_SEBLOK) / 60 || '–'}</td>
            <td class="kanan mono">${g.bilKelas || '–'}</td>
            <td class="mono kecil-teks">${g.tingkatan.length ? g.tingkatan.map((t) => `T${t}`).join(' ') : '–'}</td>
            <td class="kecil-teks redup">${Object.entries(g.per).map(([k, v]) => `${esc(k)} ${v}`).join(' · ') || '–'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="nota kecil-teks">Panjang palang dibandingkan dengan guru yang paling banyak blok.</p>`;
}

/* ---------- Tab: Semakan ---------- */

function paparSemakan() {
  const TAJUK = { ralat: 'Perlu dibetulkan', amaran: 'Sila semak', info: 'Maklumat' };
  const ikut = (t) => ISU.filter((i) => i.tahap === t);
  const kumpul = (senarai) => {
    const m = new Map();
    for (const i of senarai) m.set(i.kategori, [...(m.get(i.kategori) ?? []), i]);
    return [...m.entries()];
  };
  let h = `<div class="tindan-besar">
    <div class="ringkas tiga">
      ${[['ralat', 'ralat', 'g-rose'], ['amaran', 'amaran', 'g-amber'], ['info', 'info', 'g-slate']].map(([t, ik, w]) => `
        <div class="kad-angka statik"><span class="cip-ikon ${w}">${ikon(ik)}</span>
          <span><span class="label">${TAJUK[t]}</span><span class="angka">${ikut(t).length}</span></span></div>`).join('')}
    </div>`;
  for (const t of ['ralat', 'amaran', 'info']) {
    const kumpulan = kumpul(ikut(t));
    if (!kumpulan.length) continue;
    h += `<section><h2 class="tajuk-bahagian">${TAJUK[t]}</h2><div class="tindan">
      ${kumpulan.map(([kategori, senarai]) => `
        <details class="isu ${t}"${t !== 'info' ? ' open' : ''}>
          <summary>${esc(kategori)} <span class="mono redup">(${senarai.length})</span></summary>
          <ul>${senarai.map((i) => `<li><span>${esc(i.teks)}</span>${i.subjek ? `<button class="pautan" data-act="pergiSubjek" data-k="${esc(i.subjek)}">Buka ${esc(i.subjek)}</button>` : ''}</li>`).join('')}</ul>
        </details>`).join('')}
    </div></section>`;
  }
  if (!ISU.length) h += '<p style="color:var(--ok)">Tiada isu ditemui.</p>';
  return h + '</div>';
}

      <div class="borang">

    </section>

    <section class="panel zon-bahaya">
      ${kepalaPanel('pangkalan', 'g-rose', 'Kosongkan semua agihan', 'Memadam semua tanda agihan, senarai guru dalam grid dan guru kelas (cth. untuk tahun baharu). Subjek dan senarai guru tidak terjejas. Hanya ditulis ke Sheet apabila anda klik Simpan; agihan lama disimpan dalam helaian SANDARAN_AGIHAN.')}
      <div class="borang">
        <label><span class="label">Taip KOSONGKAN untuk mengesahkan</span><input id="sah-kosong" class="inp sederhana mono" autocomplete="off" value="${esc(draf('sahKosong'))}" data-input="draf" data-d="sahKosong" data-enter="kosongkan"></label>
        <button class="btn bahaya" data-act="kosongkan">Kosongkan semua agihan</button>
      </div>
      ${ui.mesejBahaya ? `<p class="mesej" role="status">${esc(ui.mesejBahaya)}</p>` : ''}
    </section>
  </div>`;
}

function barisSubjek(s) {
  const blok = st.blok[s.kod] ?? [];
  const set = s.jenis === 'set';
  return `<tr>
    <td style="white-space:nowrap"><span class="mono" style="font-weight:500">${esc(s.kod)}</span> <span class="redup">${esc(s.nama)}</span></td>
    <td><select id="jn-${esc(s.kod)}" class="inp-pendek" data-change="jenis" data-k="${esc(s.kod)}" aria-label="Jenis ${esc(s.kod)}">
      <option value="kelas"${!set ? ' selected' : ''}>kelas</option><option value="set"${set ? ' selected' : ''}>set</option></select></td>
    <td class="tengah"><input id="ja-${esc(s.kod)}" class="inp-blok" type="number" min="0" max="9" value="${s.jangkaanAsal}" data-change="jangkaanAsal" data-k="${esc(s.kod)}" aria-label="Jangkaan guru ${esc(s.kod)}"></td>
    ${TINGKATAN.map((t, i) => `<td class="tengah"><input id="b-${esc(s.kod)}-${i}" class="inp-blok" type="number" min="0" max="20" value="${blok[i] ?? ''}" data-change="blok" data-k="${esc(s.kod)}" data-i="${i}" aria-label="Blok ${esc(s.kod)} Tingkatan ${t}"></td>`).join('')}
    <td><div class="kotak-semak">${set ? `<input id="lp-${esc(s.kod)}" type="checkbox"${s.liputanPenuh ? ' checked' : ''} data-change="bendera" data-f="liputanPenuh" data-k="${esc(s.kod)}" aria-label="Liputan semua kelas ${esc(s.kod)}">` : '<span class="redup">–</span>'}</div></td>
    <td><div class="kotak-semak"><input id="bl-${esc(s.kod)}" type="checkbox"${s.bolehLebih ? ' checked' : ''} data-change="bendera" data-f="bolehLebih" data-k="${esc(s.kod)}" aria-label="Benarkan lebih guru ${esc(s.kod)}"></div></td>
    <td><input id="kp-${esc(s.kod)}" class="inp-pendek mono" style="width:6.5rem" value="${esc(s.kumpulan)}" data-change="kumpulan" data-k="${esc(s.kod)}" placeholder="–" aria-label="Kumpulan alternatif ${esc(s.kod)}"></td>
    <td>${set ? `<div class="cip-senarai">
        ${unitsFor(st, s.kod).map((u) => `<span class="cip">${esc(u.label)}${btnDua(`unit:${s.kod}:${u.label}`, '×', 'buang?', '', `data-act="buangUnit" data-k="${esc(s.kod)}" data-u="${esc(u.label)}" title="Buang unit ${esc(u.label)} dan agihannya"`)}</span>`).join('')}
        <input id="tu-${esc(s.kod)}" class="inp-pendek mono" style="width:5.5rem" placeholder="+ unit" value="${esc(draf(`unit-${s.kod}`))}" data-input="draf" data-d="unit-${esc(s.kod)}" data-enter="tambahUnitTetapan" data-k="${esc(s.kod)}" aria-label="Tambah unit ${esc(s.kod)}">
      </div>` : '<span class="redup kecil-teks">unit = kelas</span>'}</td>
    <td>${btnDua(`subjek:${s.kod}`, '×', 'Buang?', 'ikon-buang', `data-act="buangSubjek" data-k="${esc(s.kod)}" title="Buang subjek dan semua agihannya"`)}</td>
  </tr>`;
}

/* ---------- Tindakan ---------- */

const tambahBaris = (s, kod, g) => {
  s.rows[kod] = s.rows[kod] ?? [];
  if (!s.rows[kod].includes(g)) s.rows[kod].push(g);
};

/** Tambah unit pada subjek set. Pulangkan mesej (kosong jika berjaya tanpa amaran). */
function tambahUnit(kod, raw) {
  const def = subjekDef(st, kod);
  const u = parseUnit(raw);
  if (!u) return { ok: false, mesej: 'Format unit tidak sah. Contoh: 3JK, 2BFH (tingkatan diikuti huruf kelas B F H J K R).' };
  if (unitsFor(st, kod).some((x) => x.label === u.label)) return { ok: false, mesej: `Unit ${u.label} sudah ada dalam ${kod}.` };
  ubah((s) => {
    s.units[kod] = s.units[kod] ?? [];
    s.units[kod].push(u);
    s.jangkaan[kod] = s.jangkaan[kod] ?? {};
    s.jangkaan[kod][u.label] = def.jangkaanAsal;
  });
  return { ok: true, mesej: st.blok[kod]?.[u.tingkatan - 1] == null ? `Unit ${u.label} ditambah, tetapi blok ${kod} Tingkatan ${u.tingkatan} belum ditetapkan.` : '' };
}

const A = {
  tab: (el) => { ui.tab = el.dataset.id; ui.mesej = ''; render(); window.scrollTo(0, 0); autoSimpan(); },
  simpan: () => simpan(false),
  paksaSimpan: () => { ui.banner = null; simpan(true); },
  muatSemula: () => muat(),
  muatSemulaTerus: () => muat(),
  bukaSheet: () => bukaUrl(meta.urlSheet),
  excel: () => bukaUrl(meta.urlXlsx, true),
  csv: () => bukaUrl(meta.urlCsvRingkasan, true),
  tutupBanner: () => { ui.banner = null; renderShell(); },

  togol: (el) => {
    const g = ui.baris[Number(el.dataset.g)];
    const u = el.dataset.u;
    const kod = ui.subjek;
    ubah((s) => {
      const i = s.tugasan.findIndex((t) => t.guru === g && t.subjek === kod && t.unit === u);
      if (i >= 0) s.tugasan.splice(i, 1);
      else s.tugasan.push({ guru: g, subjek: kod, unit: u });
      tambahBaris(s, kod, g);
    });
  },
  buangBaris: (el) => {
    const g = ui.baris[Number(el.dataset.g)];
    const kod = ui.subjek;
    ubah((s) => {
      s.tugasan = s.tugasan.filter((t) => !(t.guru === g && t.subjek === kod));
      s.rows[kod] = (s.rows[kod] ?? []).filter((x) => x !== g);
    });
  },
  tambahGuruGrid: () => {
    const q = norm(draf('guru'));
    if (!q) return;
    const tepat = st.guru.filter((g) => norm(g.nama) === q);
    const sebahagian = st.guru.filter((g) => norm(g.nama).includes(q));
    const pilih = tepat.length === 1 ? tepat[0] : sebahagian.length === 1 ? sebahagian[0] : null;
    if (!pilih) {
      ui.mesej = sebahagian.length > 1 ? `${sebahagian.length} nama sepadan. Taip lebih lengkap atau pilih daripada senarai.` : 'Nama tiada dalam senarai guru. Tambah di tab Tetapan.';
      render();
      return;
    }
    ui.mesej = '';
    ui.draf.guru = '';
    ubah((s) => tambahBaris(s, ui.subjek, pilih.nama));
  },
  tambahUnitGrid: () => {
    const r = tambahUnit(ui.subjek, draf('unit'));
    if (r.ok) ui.draf.unit = '';
    ui.mesej = r.mesej;
    render();
  },
  tambahUnitTetapan: (el) => {
    const kod = el.dataset.k;
    const r = tambahUnit(kod, draf(`unit-${kod}`));
    if (r.ok) ui.draf[`unit-${kod}`] = '';
    ui.mesejTetapan = r.mesej;
    render();
  },

  tk: (el) => { ui.tk = Number(el.dataset.t); render(); },
  kembang: (el) => { ui.buka[el.dataset.k] = !ui.buka[el.dataset.k]; render(); },
  tapis: (el) => { ui.tapis = el.dataset.s; render(); },
  pergiSubjek: (el) => { ui.subjek = el.dataset.k; ui.tab = 'agihan'; render(); window.scrollTo(0, 0); },

  buangUnit: (el) => {
    const { k, u } = el.dataset;
    ubah((s) => {
      s.units[k] = (s.units[k] ?? []).filter((x) => x.label !== u);
      s.tugasan = s.tugasan.filter((t) => !(t.subjek === k && t.unit === u));
      if (s.jangkaan[k]) delete s.jangkaan[k][u];
    });
  },
  buangSubjek: (el) => {
    const k = el.dataset.k;
    ubah((s) => {
      s.subjek = s.subjek.filter((x) => x.kod !== k);
      delete s.blok[k]; delete s.units[k]; delete s.jangkaan[k]; delete s.rows[k];
      s.tugasan = s.tugasan.filter((t) => t.subjek !== k);
    });
    if (ui.subjek === k) ui.subjek = st.subjek[0]?.kod ?? '';
  },
  tambahSubjek: () => {
    const kod = String(draf('sbKod')).replace(/\s+/g, '').toUpperCase();
    const nama = String(draf('sbNama')).trim() || kod;
    const jenis = draf('sbJenis', 'kelas');
    if (!kod) { ui.mesejTetapan = 'Isi kod subjek.'; render(); return; }
    if (subjekDef(st, kod)) { ui.mesejTetapan = `Subjek ${kod} sudah ada.`; render(); return; }
    ui.mesejTetapan = `${kod} ditambah. Isi blok T1–T5${jenis === 'set' ? ' dan tambah unit' : ''}.`;
    ui.draf.sbKod = ''; ui.draf.sbNama = '';
    ubah((s) => {
      s.subjek.push({ kod, nama, jenis, jangkaanAsal: 1, liputanPenuh: true, bolehLebih: false, kumpulan: '' });
      s.blok[kod] = [null, null, null, null, null];
      if (jenis === 'set') s.units[kod] = [];
    });
  },
  tambahGuru: () => {
    const n = norm(draf('gNama'));
    if (!n) return;
    if (st.guru.some((g) => norm(g.nama) === n)) { ui.mesejGuru = 'Nama itu sudah ada dalam senarai.'; render(); return; }
    ui.mesejGuru = `${n} ditambah.`;
    ui.draf.gNama = '';
    ubah((s) => {
      s.guru.push({ nama: n });
      s.guru.sort((a, b) => a.nama.localeCompare(b.nama));
    });
  },
  buangGuru: (el) => {
    const g = st.guru[Number(el.dataset.i)];
    if (!g) return;
    ubah((s) => {
      s.guru = s.guru.filter((x) => x.nama !== g.nama);
      s.tugasan = s.tugasan.filter((t) => t.guru !== g.nama);
      for (const k of Object.keys(s.rows)) s.rows[k] = s.rows[k].filter((x) => x !== g.nama);
      for (const k of Object.keys(s.guruKelas)) if (s.guruKelas[k] === g.nama) delete s.guruKelas[k];
    });
  },
  setMod: (el) => tukarAkses(el.dataset.m, null),
  aktifkanLesen: () => {
    const i = document.getElementById('kod-lesen');
    const kod = i ? i.value.trim() : '';
    if (!kod || ui.lesenSibuk) return;
    ui.lesenSibuk = true;
    ui.mesejLesen = '';
    paparLesen(meta);
    google.script.run
      .withSuccessHandler(() => { ui.lesenSibuk = false; muat(); })
      .withFailureHandler((e) => { ui.lesenSibuk = false; ui.mesejLesen = mesejRalat(e); paparLesen({ ...meta, kod }); })
      .aktifkanLesen(kod);
  },
  simpanPentadbir: () => tukarAkses(meta.mod || 'buka', draf('pentadbir', (meta.pentadbir || []).join(', '))),
  kosongkan: () => {
    if (String(draf('sahKosong')).trim().toUpperCase() !== 'KOSONGKAN') { ui.mesejBahaya = 'Taip KOSONGKAN dalam kotak untuk mengesahkan.'; render(); return; }
    const bil = st.tugasan.length;
    ui.draf.sahKosong = '';
    ui.mesejBahaya = `${bil} tugasan dikosongkan. Klik Simpan untuk menulis ke Sheet, atau Muat semula untuk membatalkan.`;
    ubah((s) => { s.tugasan = []; s.rows = {}; s.guruKelas = {}; });
  },
};

const C = {
  subjek: (el) => { ui.subjek = el.value; ui.mesej = ''; render(); },
  susun: (el) => { ui.susun = el.value; render(); },
  jangkaan: (el) => ubah((s) => {
    s.jangkaan[ui.subjek] = s.jangkaan[ui.subjek] ?? {};
    s.jangkaan[ui.subjek][el.dataset.u] = Math.max(0, Math.floor(Number(el.value) || 0));
  }),
  guruKelas: (el) => ubah((s) => {
    if (el.value) s.guruKelas[el.dataset.k] = el.value;
    else delete s.guruKelas[el.dataset.k];
  }),
  blok: (el) => ubah((s) => {
    const v = el.value.trim();
    s.blok[el.dataset.k][Number(el.dataset.i)] = v === '' ? null : Math.max(0, Math.floor(Number(v) || 0));
  }),
  jangkaanAsal: (el) => ubah((s) => {
    const d = subjekDef(s, el.dataset.k);
    d.jangkaanAsal = Math.max(0, Math.floor(Number(el.value) || 0));
  }),
  bendera: (el) => ubah((s) => { subjekDef(s, el.dataset.k)[el.dataset.f] = el.checked; }),
  kumpulan: (el) => ubah((s) => { subjekDef(s, el.dataset.k).kumpulan = norm(el.value); }),
  jenis: (el) => {
    const kod = el.dataset.k;
    const ke = el.value;
    if (ke === 'kelas') {
      // Tugasan pada unit gabungan (lebih daripada satu kelas) tidak boleh wujud dalam subjek kelas.
      const gabung = st.tugasan.filter((t) => t.subjek === kod && (parseUnit(t.unit)?.kelas.length ?? 0) !== 1);
      if (gabung.length && !window.confirm(`${gabung.length} tugasan ${kod} berada pada unit gabungan dan akan dibuang. Teruskan?`)) {
        render();
        return;
      }
      ubah((s) => {
        subjekDef(s, kod).jenis = 'kelas';
        s.tugasan = s.tugasan.filter((t) => !(t.subjek === kod && (parseUnit(t.unit)?.kelas.length ?? 0) !== 1));
        delete s.units[kod];
      });
    } else {
      // Jadikan set: unit sedia ada (kelas yang sudah diagih) dibawa sebagai unit satu kelas.
      ubah((s) => {
        subjekDef(s, kod).jenis = 'set';
        const label = [...new Set(s.tugasan.filter((t) => t.subjek === kod).map((t) => t.unit))];
        s.units[kod] = label.map(parseUnit).filter(Boolean);
      });
    }
  },
};

/* ---------- Pendengar acara ---------- */

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const k = el.dataset.sah;
  if (k && ui.sahkan !== k) {
    ui.sahkan = k;
    clearTimeout(sahkanTimer);
    sahkanTimer = setTimeout(() => { ui.sahkan = null; render(); renderShell(); }, 3000);
    if (st) render(); else renderShell();
    const semula = document.querySelector(`[data-sah="${CSS.escape(k)}"]`);
    if (semula) semula.focus({ preventScroll: true });
    return;
  }
  ui.sahkan = null;
  clearTimeout(sahkanTimer);
  if (halangTetapan(el.dataset.act)) return;
  A[el.dataset.act]?.(el, e);
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (halangTetapan(el.dataset.change)) { render(); return; }
  C[el.dataset.change]?.(el);
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.input === 'draf') ui.draf[el.dataset.d] = el.value;
  if (el.dataset.input === 'cari') { ui.cari = el.value; render(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (kotor) simpan(false);
    return;
  }
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.enter) {
    e.preventDefault();
    if (halangTetapan(el.dataset.enter)) return;
    A[el.dataset.enter]?.(el, e);
  }
});

// Aktiviti pengguna menangguhkan simpan automatik "tidak aktif"
['click', 'keydown', 'input'].forEach((jenis) => document.addEventListener(jenis, () => { if (kotor && !sibuk) tetapkanTidakAktif(); }, true));
// Bertukar tab pelayar / meminimumkan tetingkap
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoSimpan(); });
window.addEventListener('pagehide', autoSimpan);

window.addEventListener('beforeunload', (e) => {
  if (kotor) { e.preventDefault(); e.returnValue = ''; }
});

muat();
</script>

</body>
</html>
